name: CI

on:
  pull_request:
    paths:
      - typescript/**
      - .github/workflows/ci.yaml
  push:
    branches: [main]
    paths:
      - typescript/**
      - .github/workflows/ci.yaml

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install example dependencies
        working-directory: typescript/example
        run: pnpm install --frozen-lockfile

      - name: Build example
        working-directory: typescript/example
        run: pnpm build
