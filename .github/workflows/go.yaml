name: Go

on:
  pull_request:
    paths:
      - go/**
      - Taskfile.yaml
      - .github/workflows/go.yaml
  push:
    branches: [main]
    paths:
      - go/**
      - Taskfile.yaml
      - .github/workflows/go.yaml

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # zz_generated.duty_models.go is copied from duty and rewritten with gopatch; a
      # hand edit or a duty bump without regenerating would ship types nobody can rebuild.
      - name: Check generated code
        working-directory: .
        run: task go:generate:check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # clientapi holds the wire types every client shares, so it stays free of dependencies
      # beyond the standard library and github.com/google/uuid.
      - name: Check clientapi dependencies
        run: |
          unexpected="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./clientapi \
            | grep -vxF -e github.com/flanksource/mission-control-sdk/go/clientapi -e github.com/google/uuid || true)"
          if [ -n "$unexpected" ]; then
            echo "clientapi may depend only on the standard library and github.com/google/uuid, but imports:"
            printf '%s\n' "$unexpected" | sed 's/^/  - /'
            exit 1
          fi

  release:
    name: Release
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize tagging so concurrent merges don't compute and push the same next tag.
    concurrency:
      group: go-release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag the next go/vX.Y.Z
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest="$(git tag --list 'go/v*' --sort=-v:refname | head -n1)"
          if [ -n "$latest" ] && git diff --quiet "${latest}..HEAD" -- .; then
            echo "No go/ changes since ${latest}; skipping"
            exit 0
          fi
          version="${latest##*/}"
          IFS=. read -r major minor patch <<< "${version:-v0.0.0}"
          tag="go/${major}.${minor}.$((patch + 1))"
          echo "Creating ${tag}"
          git tag "$tag" HEAD
          git push origin "refs/tags/${tag}"
