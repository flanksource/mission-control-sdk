name: Release and Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  # Let pnpm request a short-lived GitHub OIDC token for npm trusted publishing
  # and provenance, instead of using a long-lived NPM_TOKEN secret.
  id-token: write

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          name=$(node -p "require('./package.json').name")
          if versions=$(npm view "$name" versions --json); then
            published=$(printf '%s' "$versions" | jq -r 'if type == "array" then .[] else . end' | sort -V | tail -1)
            npm version "$published" --no-git-tag-version --allow-same-version >/dev/null
            new_version=$(npm version patch --no-git-tag-version)
          elif [ "$(printf '%s' "$versions" | jq -r '.error.code')" = "E404" ]; then
            new_version="v$(node -p "require('./package.json').version")"
          else
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${new_version}"; then
            echo "Tag ${new_version} already exists. Resolve the unpublished tag or bootstrap the package on npm before releasing."
            exit 1
          fi
          echo "version=${new_version#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm publish --access public --no-git-checks

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git add package.json
          git commit --allow-empty -m "chore(release): ${VERSION}"
          git tag "${TAG}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "${TAG}" --title "Release ${TAG}" --generate-notes
